name: Release PixieVault

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev bubblewrap

      - name: Sync Frontend Assets & Bridge
        run: |
          node scripts/sync-bridge.js

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PixieVault Host Runtime ${{ github.ref_name }}'
          releaseBody: |
            ## PixieVault Host Runtime Release
            
            Zero-Trust, Air-Gapped Desktop Application Host & Micro-Orchestrator.
            
            ### Included Assets:
            - **Windows**: `.msi` Installer & Portable `.exe`
            - **Linux**: `.AppImage` & `.deb` Package
            - **macOS**: `.dmg` Disk Image
            
            ### Integrity & Security:
            - Argon2id Master Key Derivation
            - Authenticated AES-256-GCM Vault Containers
            - Loopback Namespace / Bubblewrap Sandboxing
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
