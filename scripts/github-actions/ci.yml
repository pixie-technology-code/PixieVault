name: CI & Reliability Suite

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test-suite:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev bubblewrap

      - name: Run Full Multi-Tier Test Suite (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x test-all.sh
          ./test-all.sh

      - name: Run Full Multi-Tier Test Suite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\test-all.ps1
