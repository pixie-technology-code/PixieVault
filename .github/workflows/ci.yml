name: CI & Reliability Suite

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev bubblewrap

      - name: Validate Shell Assets & Bridge Integrity
        run: |
          node tests/validate-dist-assets.js

      - name: Run Rust Core Unit Tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --test unit_tests

      - name: Run Rust Persistence Tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --test persistence_tests

      - name: Run Rust Sandbox Tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --test sandbox_tests
