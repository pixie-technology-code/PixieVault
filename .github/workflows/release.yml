name: Auto-Version & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils bubblewrap libfuse2

      - name: Install Tauri v2 CLI
        run: npm install -g @tauri-apps/cli@^2.0.0

      - name: Sync Frontend Assets & Bridge
        run: |
          node scripts/sync-bridge.js

      - name: Build Tauri Desktop Application & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          tagName: v__VERSION__
          releaseName: 'PixieVault Host Runtime v__VERSION__'
          releaseBody: |
            ## PixieVault Host Runtime (v__VERSION__)
            
            Zero-Trust, Air-Gapped Desktop Application Host & Micro-Orchestrator.
            
            ### Included Multi-Platform Assets:
            - **Windows**: `.exe` (NSIS Installer)
            - **Linux**: Universal `.AppImage` & Debian `.deb`
            - **macOS**: Apple Disk Image `.dmg`
            
            ### Security & Architecture:
            - Argon2id Master Key Derivation & Hardware-Wrapped Envelope (v3)
            - Windows Hello Biometric/PIN & TPM 2.0 Protection
            - Multi-Device OneDrive Synchronization Support
            - Ephemeral Loopback HTTP Micro-Orchestration (`VaultComposer`)
            - 100% Native Desktop Menu Integration
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
