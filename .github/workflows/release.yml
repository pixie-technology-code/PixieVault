name: Auto-Version & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-check:
    name: Auto-Tag Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_name: ${{ steps.get_version.outputs.tag_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version from tauri.conf.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG_NAME="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Detected application version: $VERSION (Tag: $TAG_NAME)"

      - name: Create Git Tag if missing
        run: |
          TAG="${{ steps.get_version.outputs.tag_name }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on remote."
          else
            echo "Creating and pushing tag $TAG..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Automated release $TAG"
            git push origin "$TAG"
          fi

  build-and-release:
    name: Build & Release (${{ matrix.platform }})
    needs: tag-check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils bubblewrap

      - name: Install Tauri v2 CLI
        run: npm install -g @tauri-apps/cli@^2.0.0

      - name: Sync Frontend Assets & Bridge
        run: |
          node scripts/sync-bridge.js

      - name: Build Tauri Desktop Application & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.tag-check.outputs.tag_name }}
          releaseName: 'PixieVault Host Runtime ${{ needs.tag-check.outputs.tag_name }}'
          releaseBody: |
            ## PixieVault Host Runtime Release (${{ needs.tag-check.outputs.tag_name }})
            
            Zero-Trust, Air-Gapped Desktop Application Host & Micro-Orchestrator.
            
            ### Included Multi-Platform Assets:
            - **Windows**: `.msi` Installer & Standalone `.exe`
            - **Linux**: Universal `.AppImage` & Debian `.deb`
            - **macOS**: Apple Disk Image `.dmg`
            
            ### Security & Architecture:
            - Argon2id Master Key Derivation
            - Authenticated AES-256-GCM Encrypted Storage (`.pvlt`)
            - Ephemeral Loopback HTTP Micro-Orchestration (`VaultComposer`)
            - Zero-Trust Inter-App Telemetry Bus
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
